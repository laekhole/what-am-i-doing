[package]
name = "waid-desktop"
version = "0.5.2"
edition = "2021"
license = "MIT"
description = "waid desktop shell"

# 코어와 dependency graph / lockfile / 빌드 출력을 공유하지 않는다.
[workspace]

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
