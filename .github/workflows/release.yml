name: Windows release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CARGO_TERM_COLOR: always
      CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Windows SDK and MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed.' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed.' }

      - name: Test, build and verify standalone EXE
        run: ./desktop/build.ps1 -Portable -Tag $env:RELEASE_TAG

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign and verify
        working-directory: desktop/target/release/bundle
        run: |
          $exe = "waid-$env:RELEASE_TAG-windows-x64.exe"
          cosign sign-blob --yes --bundle "$exe.sigstore.json" $exe
          if ($LASTEXITCODE -ne 0) { throw 'Keyless signing failed.' }
          cosign verify-blob --bundle "$exe.sigstore.json" --certificate-identity $env:CERTIFICATE_IDENTITY --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' $exe
          if ($LASTEXITCODE -ne 0) { throw 'Signature verification failed.' }

      - name: Upload to draft and publish
        working-directory: desktop/target/release/bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $exe = "waid-$env:RELEASE_TAG-windows-x64.exe"
          $releaseArgs = @('--draft', '--verify-tag', '--title', "waid $env:RELEASE_TAG", '--notes-file', (Join-Path $env:GITHUB_WORKSPACE "releases/$env:RELEASE_TAG.md"))
          if ($env:RELEASE_TAG.Contains('-')) { $releaseArgs += '--prerelease' }
          gh release create $env:RELEASE_TAG $exe "$exe.sigstore.json" SHA256SUMS.txt @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation or asset upload failed. Inspect the draft before retrying.' }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed. The uploaded draft is retained.' }
