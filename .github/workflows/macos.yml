name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Test the collector and CLI
        run: cargo test --release --locked
      - name: Build AppKit and test shared desktop and Mac actions
        run: |
          cargo build --manifest-path desktop/Cargo.toml --release --locked
          cargo test --manifest-path desktop/Cargo.toml --release --locked
      - name: Package the native development app
        run: bash desktop/package-macos.sh
      - name: AppKit smoke on isolated settings
        timeout-minutes: 2
        run: |
          export WAID_DATA_DIR="$RUNNER_TEMP/waid-smoke"
          export CODEX_HOME="$RUNNER_TEMP/waid-fixture"
          export WAID_SMOKE_SCREENSHOT="$RUNNER_TEMP/waid-smoke.png"
          mkdir -p "$CODEX_HOME/sessions"
          printf '%s\n' '{"type":"session_meta","payload":{"id":"mac-smoke","cwd":"/tmp/Mac project"}}' '{"type":"response_item","payload":{"type":"message","role":"user","content":"Mac fixture — 한글 prompt\nSecond line"}}' > "$CODEX_HOME/sessions/smoke.jsonl"
          desktop/target/macos-bundle/waid.app/Contents/MacOS/waid --macos-smoke
          desktop/target/macos-bundle/waid.app/Contents/MacOS/waid --macos-smoke
      - name: Upload development app (not a release)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waid-${{ matrix.runner }}
          path: |
            desktop/target/macos-bundle/*.zip
            desktop/target/macos-bundle/SHA256SUMS.txt
            ${{ runner.temp }}/waid-smoke*.png
          if-no-files-found: error
          retention-days: 7
